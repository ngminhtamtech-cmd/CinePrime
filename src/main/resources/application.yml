spring:
  application:
    name: CinePrime
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cineprime?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:cineprime}
    password: ${DB_PASSWORD:}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  pug4j:
    cache: ${TEMPLATE_CACHE:true}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_TLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
server:
  forward-headers-strategy: framework
  error:
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
cineprime:
  base-url: ${BASE_URL:http://localhost:8080}
  uploads: ${UPLOAD_DIR:./uploads}
  mail-from: ${MAIL_FROM:noreply@cineprime.example}
  mail-enabled: ${MAIL_ENABLED:false}
  seed: ${DEMO_SEED:false}
  demo-password: ${DEMO_PASSWORD:}
  pdf-font: ${PDF_FONT:}
  momo:
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    endpoint: https://test-payment.momo.vn
